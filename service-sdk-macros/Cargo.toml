[package]
name = "service-sdk-macros"
version = "0.5.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
grpc = []
my-service-bus = []
no-sql-reader = []
no-sql-writer = []
postgres = []
# Gates `use_signal_r_json_contract!` / `use_signal_r_subscriber!`. They expand to
# `use service_sdk::my_http_server::signal_r::...`, and that module only exists
# when service-sdk' own `signal-r` feature is on - so without this the macros
# would expand into an unresolved import instead of a readable error.
signal-r = []


[lib]
proc-macro = true

[dependencies]
quote = "*"

proc-macro2 = "*"

syn = { version = "*", features = ["full"] }
