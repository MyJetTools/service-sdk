[package]
name = "service-sdk"
version = "0.5.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

my-nosql-sdk = ["dep:my-no-sql-sdk"]

my-nosql-data-reader-sdk = [
    "dep:my-no-sql-sdk",
    "my-no-sql-sdk/data-reader",
    "service-sdk-macros/no-sql-reader",
]

my-nosql-data-writer-sdk = [
    "dep:my-no-sql-sdk",
    "my-no-sql-sdk/data-writer",
    "service-sdk-macros/no-sql-writer",
]

macros = [
    "my-no-sql-sdk?/macros",
    "my-service-bus?/macros",
    "my-grpc-extensions?/grpc-server",
    "my-grpc-extensions?/grpc-client",
]

# Links the SSH stack (my-ssh / libssh2 / openssl-sys). Without it no ssh crate
# is in the tree at all. Propagated to every dependency that can pull one in.
with-ssh = [
    "flurl/with-ssh",
    "my-grpc-extensions?/with-ssh",
    "my-no-sql-sdk?/with-ssh",
    "my-postgres?/with-ssh",
]

http-static-files = ["my-http-server/static-files"]

full = [
    "my-service-bus",
    "my-nosql-sdk",
    "my-nosql-data-reader-sdk",
    "my-nosql-data-writer-sdk",
    "grpc",
    "postgres",
    "macros",
]
my-service-bus = ["dep:my-service-bus", "service-sdk-macros/my-service-bus"]

websockets = ["my-http-server/websocket"]


grpc = ["dep:futures-core", "dep:my-grpc-extensions", "service-sdk-macros/grpc"]

# ---------------------------------------------------------------------------
# rustls TLS. Pick exactly one of the two provider features below.
#
# Both link the same TLS stack (my-tls / rustls) and enable the same
# functionality - `https://` through fl-url, TLS gRPC, client certificates. They
# differ only in the rustls CryptoProvider, hence the provider in the name.
#
# With neither, no rustls / webpki / ring / rcgen / graviola crate is in the tree
# at all, `ServiceContext` installs no crypto provider, and an `https://` request
# through fl-url panics at execute time.
#
# Postgres TLS is a different stack entirely (openssl) - see `with-postgres-tls`.
# ---------------------------------------------------------------------------

# ring. The default recommendation: mature and very widely deployed. Costs a
# bundled C/assembly build, so a C toolchain is required. No aws-lc-sys either
# way.
with-ring-tls = [
    "dep:my-tls",
    "my-tls/with-ring-crypto-providers",
    "flurl/with-ring-tls",
    "my-grpc-extensions?/with-ring-tls",
]

# Pure Rust, via rustls-graviola - no C toolchain anywhere, no build script.
# Trade-offs vs ring: graviola builds ONLY on x86_64 and aarch64 (a hard
# `compile_error!` on any other target) and is a far younger, much less deployed
# crypto implementation. Prefer `with-ring-tls` unless getting rid of the C
# toolchain is the point.
#
# Enabling both - which `--all-features` does - is not an error: my-tls resolves
# the conflict in favour of ring, so the more battle-tested provider wins.
with-rust-tls = [
    "dep:my-tls",
    "my-tls/with-rust-crypto-providers",
    "flurl/with-rust-tls",
    "my-grpc-extensions?/with-rust-tls",
]

# Postgres speaks TLS through openssl, not rustls, so it is a separate switch.
# No-op unless the `postgres` feature is on as well.
with-postgres-tls = ["my-postgres?/with-tls"]

postgres = [
    "dep:my-postgres",
    "dep:tokio-postgres",
    "service-sdk-macros/postgres",
]

signal-r = ["my-http-server/signal-r", "service-sdk-macros/signal-r"]


[dependencies]
serde = { version = "*" }
tokio = { version = "*", features = ["rt", "rt-multi-thread", "fs"] }
async-trait = "*"
service-sdk-macros = { path = "../service-sdk-macros" }
tokio-stream = "*"

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
    "base64",
] }

is-alive-middleware = { tag = "0.9.0", git = "https://github.com/MyJetTools/is-alive-middleware.git" }
my-telemetry = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-telemetry.git", features = [
    "my-telemetry-writer",
] }

my-no-sql-sdk = { optional = true, git = "https://github.com/MyJetTools/my-no-sql-sdk.git", tag = "0.5.1" }
my-service-bus = { optional = true, git = "https://github.com/MyJetTools/my-service-bus-sdk.git", tag = "1.1.6", features = [
    "client",
    "with-telemetry",
] }

my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git", features = [
    "my-seq-logger",
] }
my-http-server = { tag = "0.9.0", git = "https://github.com/MyJetTools/my-http-server", features = [
    "controllers",
    "macros",
    "with-telemetry",
] }

# `with-tls` is deliberately NOT listed here - it drags openssl in. It is turned
# on through the `with-postgres-tls` feature instead.
my-postgres = { tag = "0.6.0", git = "https://github.com/MyJetTools/my-postgres.git", features = [
    "with-telemetry",
    "macros",
], optional = true }

tokio-postgres = { version = "*", optional = true }

my-grpc-extensions = { optional = true, tag = "0.7.0", git = "https://github.com/MyJetTools/my-grpc-extensions", features = [
    "with-telemetry",
] }


my-settings-reader = { tag = "0.5.0", git = "https://github.com/MyJetTools/my-settings-reader.git", features = [
    "background-reader",
] }

flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git", default-features = false }
serde_yaml = { version = "*" }

# Only for `install_default_crypto_providers()` in `service_context.rs`. We
# deliberately do NOT depend on rustls directly: my-tls owns the provider
# choice, and a direct rustls dep would mean hand-maintaining a duplicate
# feature list that could silently drift from my-tls' (rustls 0.23 defaults also
# pull `aws_lc_rs` plus the heavy aws-lc-sys C build). Same tag as the one
# fl-url uses, so it stays a single instance in the graph.
my-tls = { tag = "0.1.5", git = "https://github.com/MyJetTools/my-tls.git", optional = true }

futures-core = { version = "*", optional = true }

metrics = "*"
stopwatch = "*"
prometheus = "*"
tower = "*"
metrics-prometheus = "*"
arc-swap = "*"
